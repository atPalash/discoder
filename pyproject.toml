[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-ollama-agent"
version = "0.1.0"
description = "A single-container Discord bot that turns coding ideas into committed Git branches using a locally hosted Ollama model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "discord.py>=2.3,<3.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "PyYAML>=6.0,<7.0",
    "GitPython>=3.1.40,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "hypothesis>=6.100,<7.0",
]

[project.scripts]
discord-ollama-agent = "discord_ollama_agent.main:main"

[tool.setuptools.packages.find]
include = ["discord_ollama_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
